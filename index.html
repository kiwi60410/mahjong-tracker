    <style>
      :root {
        --green: #2ecc71;
        --green-dark: #27ae60;
        --red: #e74c3c;
        --red-dark: #c0392b;
        --yellow: #f1c40f;
        --yellow-dark: #f39c12;
        --blue: #3498db;
        --blue-dark: #2980b9;
        --purple: #9b59b6;
        --teal: #1abc9c;
        --teal-dark: #16a085;
        --bg: #fef9f0;
        --card: #ffffff;
        --text: #2c2c2c;
        --text-muted: #888;
        --border: #ede8de;
        --radius: 16px;
        --radius-sm: 10px;
        --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.12);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Noto Sans TC", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        overflow-x: hidden;
      }
      h1,
      h2,
      h3,
      .num {
        font-family: "Nunito", sans-serif;
      }

      /* Header */
      .header {
        background: linear-gradient(135deg, #2c3e50 0%, #3d5166 100%);
        padding: 1.25rem 1.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
      }
      .header-title {
        color: #fff;
        font-size: 20px;
        font-weight: 900;
        display: flex;
        align-items: center;
        gap: 8px;
        letter-spacing: 0.5px;
      }
      .header-sub {
        color: rgba(255, 255, 255, 0.6);
        font-size: 12px;
        margin-top: 2px;
      }
      .sync-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #2ecc71;
        box-shadow: 0 0 6px #2ecc71;
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }

      /* Nav */
      .nav {
        display: flex;
        background: #fff;
        border-bottom: 2px solid var(--border);
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      .nav-btn {
        flex: 1;
        min-width: 70px;
        padding: 12px 6px 10px;
        border: none;
        background: none;
        cursor: pointer;
        font-size: 11px;
        color: var(--text-muted);
        font-family: "Noto Sans TC", sans-serif;
        border-bottom: 3px solid transparent;
        margin-bottom: -2px;
        transition: all 0.2s;
        white-space: nowrap;
        font-weight: 500;
      }
      .nav-btn .icon {
        display: block;
        font-size: 18px;
        margin-bottom: 3px;
      }
      .nav-btn.active {
        color: var(--blue);
        border-bottom-color: var(--blue);
        font-weight: 700;
      }
      .nav-btn:hover:not(.active) {
        color: var(--text);
        background: #f9f9f9;
      }

      /* Pages */
      .page {
        display: none;
        padding: 1.25rem 1rem 6rem;
        max-width: 640px;
        margin: 0 auto;
        animation: fadeUp 0.25s ease;
      }
      .page.active {
        display: block;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Cards */
      .card {
        background: var(--card);
        border-radius: var(--radius);
        padding: 1.25rem;
        margin-bottom: 12px;
        box-shadow: var(--shadow);
        border: 1.5px solid var(--border);
      }

      /* Section titles */
      .sec-title {
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--text-muted);
        margin-bottom: 10px;
        margin-top: 1.25rem;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .sec-title:first-child {
        margin-top: 0;
      }

      /* Forms */
      .form-row {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
      }
      .form-row:last-child {
        margin-bottom: 0;
      }
      .form-group {
        flex: 1;
        min-width: 0;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        color: var(--text-muted);
        margin-bottom: 5px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      input,
      select {
        width: 100%;
        padding: 11px 13px;
        border: 2px solid var(--border);
        border-radius: var(--radius-sm);
        background: #fafaf8;
        font-family: "Noto Sans TC", sans-serif;
        font-size: 14px;
        color: var(--text);
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      input:focus,
      select:focus {
        outline: none;
        border-color: var(--blue);
        background: #fff;
        box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.12);
      }
      select {
        cursor: pointer;
      }
      .hint {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 4px;
        line-height: 1.5;
      }

      /* Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 10px 18px;
        border: 2px solid transparent;
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-size: 14px;
        font-weight: 700;
        font-family: "Noto Sans TC", sans-serif;
        transition: all 0.18s;
        white-space: nowrap;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn-blue {
        background: var(--blue);
        color: #fff;
        border-color: var(--blue);
      }
      .btn-blue:hover {
        background: var(--blue-dark);
        border-color: var(--blue-dark);
        box-shadow: 0 4px 12px rgba(52, 152, 219, 0.35);
      }
      .btn-green {
        background: var(--green);
        color: #fff;
        border-color: var(--green);
      }
      .btn-green:hover {
        background: var(--green-dark);
        border-color: var(--green-dark);
        box-shadow: 0 4px 12px rgba(46, 204, 113, 0.35);
      }
      .btn-red {
        background: none;
        color: var(--red);
        border-color: #fad7d4;
      }
      .btn-red:hover {
        background: #fdf0f0;
        border-color: var(--red);
      }
      .btn-gray {
        background: none;
        color: var(--text-muted);
        border-color: var(--border);
      }
      .btn-gray:hover {
        background: #f5f5f5;
      }
      .btn-full {
        width: 100%;
        padding: 14px;
      }
      .btn-sm {
        padding: 6px 12px;
        font-size: 12px;
        border-radius: 8px;
      }

      /* Status */
      .status {
        padding: 12px 16px;
        border-radius: var(--radius-sm);
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      .status-ok {
        background: #eafaf1;
        color: #1e8449;
        border: 1.5px solid #a9dfbf;
      }
      .status-err {
        background: #fdf0f0;
        color: var(--red-dark);
        border: 1.5px solid #f5c6c6;
      }
      .status-info {
        background: #eaf4fd;
        color: var(--blue-dark);
        border: 1.5px solid #aed9f5;
      }

      /* Player entry rows */
      .player-card {
        background: #fafaf8;
        border: 2px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 11px 14px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: border-color 0.2s;
      }
      .player-card:focus-within {
        border-color: var(--blue);
        background: #fff;
      }
      .player-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        font-weight: 800;
        font-family: "Nunito", sans-serif;
        flex-shrink: 0;
      }
      .player-name-label {
        font-weight: 700;
        font-size: 14px;
        flex: 1;
        min-width: 36px;
      }
      .player-card input {
        border: none;
        background: none;
        padding: 0;
        font-size: 15px;
        font-weight: 700;
        text-align: right;
        max-width: 130px;
      }
      .player-card input:focus {
        outline: none;
        box-shadow: none;
        border: none;
        background: none;
      }

      /* Dealer-paid badge on player card */
      .dealer-paid-tag {
        font-size: 11px;
        font-weight: 700;
        background: #fff8e1;
        color: #b7770d;
        border: 1.5px solid #ffe082;
        border-radius: 12px;
        padding: 2px 8px;
        white-space: nowrap;
        flex-shrink: 0;
      }

      /* Chips */
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 700;
        border: 1.5px solid;
      }
      .chip-blue {
        background: #eaf4fd;
        color: var(--blue-dark);
        border-color: #aed9f5;
      }
      .chip-green {
        background: #eafaf1;
        color: var(--green-dark);
        border-color: #a9dfbf;
      }
      .chip-red {
        background: #fdf0f0;
        color: var(--red-dark);
        border-color: #f5c6c6;
      }
      .chip-yellow {
        background: #fefcec;
        color: #b7770d;
        border-color: #f5e79e;
      }
      .chip-gray {
        background: #f5f5f3;
        color: #666;
        border-color: #ddd;
      }
      .chip-teal {
        background: #e8f8f5;
        color: var(--teal-dark);
        border-color: #a2d9ce;
      }
      .chip-purple {
        background: #f5eef8;
        color: #7d3c98;
        border-color: #d2b4de;
      }

      /* Metrics */
      .metric-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 14px;
      }
      .metric-grid-4 {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        margin-bottom: 14px;
      }
      .metric {
        background: linear-gradient(135deg, #f8f9fa, #fff);
        border: 1.5px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 14px 10px;
        text-align: center;
      }
      .metric-label {
        font-size: 11px;
        color: var(--text-muted);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 6px;
      }
      .metric-val {
        font-size: 22px;
        font-weight: 900;
        font-family: "Nunito", sans-serif;
        color: var(--text);
      }
      .metric-val.pos {
        color: var(--green-dark);
      }
      .metric-val.neg {
        color: var(--red-dark);
      }

      /* Player total grid */
      .player-total-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 8px;
        margin-bottom: 14px;
      }
      .player-total {
        border-radius: var(--radius-sm);
        padding: 12px;
        text-align: center;
        border: 2px solid;
      }
      .player-total .pt-name {
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .player-total .pt-val {
        font-size: 21px;
        font-weight: 900;
        font-family: "Nunito", sans-serif;
      }
      .player-total .pt-sub {
        font-size: 11px;
        margin-top: 4px;
        opacity: 0.75;
      }
      .pt-win {
        background: #eafaf1;
        border-color: #a9dfbf;
        color: var(--green-dark);
      }
      .pt-lose {
        background: #fdf0f0;
        border-color: #f5c6c6;
        color: var(--red-dark);
      }
      .pt-even {
        background: #f5f5f3;
        border-color: #ddd;
        color: #666;
      }
      .pt-teal {
        background: #e8f8f5;
        border-color: #a2d9ce;
        color: var(--teal-dark);
      }

      /* Two-layer settle card */
      .two-layer {
        border-radius: var(--radius);
        overflow: hidden;
        border: 1.5px solid var(--border);
        margin-bottom: 10px;
        box-shadow: var(--shadow);
      }
      .two-layer-top {
        background: linear-gradient(135deg, #f8f9fa, #fff);
        padding: 12px 16px;
        border-bottom: 1.5px solid var(--border);
      }
      .two-layer-bottom {
        background: #fff;
        padding: 12px 16px;
      }
      .two-layer-label {
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-muted);
        margin-bottom: 8px;
      }

      /* Settle rows */
      .settle-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 0;
        border-bottom: 1.5px dashed var(--border);

      .settle-row:last-child {
        border-bottom: none;

      .settle-from {
        font-weight: 700;
        font-size: 14px;

      .settle-arrow {
        color: var(--text-muted);

      }
      .settle-to {
        font-weight: 700;
        font-size: 14px;
        flex: 1;
      }
      .settle-amount {
        padding: 5px 14px;
        border-radius: 20px;
        font-size: 14px;
        font-weight: 800;
        font-family: "Nunito", sans-serif;
      }
      .settle-amount-pay {
        background: var(--red);
        color: #fff;
      }
      .settle-amount-recv {
        background: var(--green);
        color: #fff;
      }
      .settle-amount-neutral {
        background: var(--blue);
        color: #fff;

      /* Venue section */
      .venue-card {
        border-radius: var(--radius);

        align-items: center;

        background: #fff;

        padding: 6px 0;
        border-bottom: 1px dashed #f0ede6;

      .venue-stat-row:last-child {
        border-bottom: none;

        color: var(--text-muted);
      }
      .venue-stat-val {
        font-weight: 700;
        font-family: "Nunito", sans-serif;
        font-size: 15px;
      }

      /* History */
      .history-item {
        border-radius: var(--radius);
        overflow: hidden;
        margin-bottom: 12px;
        box-shadow: var(--shadow);
        border: 1.5px solid var(--border);
      }
      .history-head {
        background: linear-gradient(135deg, #2c3e50, #3d5166);
        padding: 12px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .history-date {
        color: #fff;
        font-weight: 700;
        font-size: 15px;
        font-family: "Nunito", sans-serif;
      }
      .history-body {
        background: #fff;
        padding: 12px 16px;
      }
      .history-dealer-note {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px dashed var(--border);
        display: flex;
        align-items: center;
        gap: 4px;
      }

      /* Member chips */
      .member-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .member-chip {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px 14px;
        border-radius: 20px;
        background: #fff;
        border: 2px solid var(--border);
        font-size: 14px;
        font-weight: 700;
        transition: border-color 0.2s;
      }
      .member-chip:hover {
        border-color: #ccc;
      }
      .member-chip .remove-btn {
        background: none;
        border: none;
        cursor: pointer;
        color: #ccc;
        font-size: 16px;
        padding: 0;
        line-height: 1;
        transition: color 0.15s;
      }
      .member-chip .remove-btn:hover {
        color: var(--red);
      }

      /* Avatar colors */
      .av0 {
        background: #fde8e8;
        color: #c0392b;
      }
      .av1 {
        background: #e8f4fd;
        color: #2980b9;
      }
      .av2 {
        background: #eafaf1;
        color: #27ae60;
      }
      .av3 {
        background: #fefcec;
        color: #b7770d;
      }
      .av4 {
        background: #f5eef8;
        color: #8e44ad;
      }
      .av5 {
        background: #fef5e7;
        color: #d35400;
      }
      .av6 {
        background: #e8f8f5;
        color: #1abc9c;
      }
      .av7 {
        background: #fdedec;
        color: #e74c3c;
      }

      /* Loading / empty */
      .loading {
        text-align: center;
        padding: 2.5rem 0;
        color: var(--text-muted);
        font-size: 14px;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid var(--border);
        border-top-color: var(--blue);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 12px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .empty {
        text-align: center;
        padding: 3rem 1rem;
        color: var(--text-muted);
      }
      .empty .empty-icon {
        font-size: 48px;
        margin-bottom: 12px;
        display: block;
      }
      .empty p {
        font-size: 14px;
        line-height: 1.6;
      }

      /* Toast */
      #toast {
        position: fixed;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: #2c3e50;
        color: #fff;
        padding: 12px 24px;
        border-radius: 30px;
        font-size: 14px;
        font-weight: 600;
        opacity: 0;
        transition: all 0.3s;
        z-index: 9999;
        pointer-events: none;
        white-space: nowrap;
        box-shadow: var(--shadow-lg);
      }
      #toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* Action bar */
      .action-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #fff;
        border-top: 1.5px solid var(--border);
        padding: 10px 1rem;
        display: flex;
        gap: 8px;
        z-index: 50;
        box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.06);
      }

      /* Misc */
      .divider {
        border: none;
        border-top: 1.5px dashed var(--border);
        margin: 14px 0;
      }
      .firebase-notice {
        background: #fff8e1;
        border: 1.5px solid #ffe082;
        border-radius: var(--radius-sm);
        padding: 12px 16px;
        font-size: 13px;
        color: #6d4c00;
        line-height: 1.6;
        margin-bottom: 12px;
      }
      .firebase-notice strong {
        display: block;
        margin-bottom: 4px;
        font-size: 14px;
      }
      code {
        background: #f0ede8;
        padding: 2px 6px;
        border-radius: 4px;
        font-family: monospace;
        font-size: 12px;
        color: #c0392b;
      }

      /* Legend */
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        color: var(--text-muted);
      }
      .legend-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }

      /* Divider with label */
      .divider-label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 16px 0 12px;
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-muted);
      }
      .divider-label::before,
      .divider-label::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div>
        <div class="header-title">🀄 麻將帳本</div>
        <div class="header-sub" id="sync-status">連線中...</div>
      </div>
      <div id="sync-indicator" class="sync-dot" style="opacity: 0"></div>
    </div>

    <nav class="nav">
      <button
        class="nav-btn active"
        onclick="switchPage('record')"
        id="nav-record"
      >
        <span class="icon">✏️</span>記錄牌局
      </button>
      <button class="nav-btn" onclick="switchPage('history')" id="nav-history">
        <span class="icon">📋</span>歷史紀錄
      </button>
      <button class="nav-btn" onclick="switchPage('settle')" id="nav-settle">
        <span class="icon">🧮</span>月結算
      </button>
      <button class="nav-btn" onclick="switchPage('players')" id="nav-players">
        <span class="icon">👥</span>成員
      </button>
    </nav>

    <!-- ═══ 記錄牌局 ═══ -->
    <div class="page active" id="page-record">
      <div id="firebase-warning" class="firebase-notice" style="display: none">
        ⚠️ <strong>尚未設定 Firebase</strong> 請編輯
        <code>index.html</code> 填入你的 Firebase 設定。
        <a href="SETUP.md" target="_blank" style="color: var(--blue)"
          >查看設定教學 →</a
        >
      </div>

      <div class="sec-title">📅 基本資訊</div>
      <div class="card">
        <div class="form-row">
          <div class="form-group">
            <label>日期</label>
            <input type="date" id="r-date" />
          </div>
          <div class="form-group">
            <label>地點</label>
            <input type="text" id="r-place" placeholder="例：小明家" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>將數</label>
            <input
              type="number"
              id="r-rounds"
              placeholder="幾將"
              min="1"
              step="1"
            />
          </div>
          <div class="form-group">
            <label>莊錢金額</label>
            <input type="number" id="r-dealer-amt" placeholder="0" step="50" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>誰當天付了莊錢</label>
            <select id="r-dealer-payer" onchange="checkSum()">
              <option value="">— 選擇付款人 —</option>
            </select>
            <div class="hint">💡 付莊錢的人月結時自動退回，不影響輸贏統計</div>
          </div>
        </div>
      </div>

      <div class="sec-title">👥 選擇本局參與成員</div>
      <div class="hint" style="margin-bottom:10px;margin-top:-4px">點選要參與本局的成員</div>
      <div id="player-picker">
        <div class="loading"><div class="spinner"></div>載入成員中…</div>
      </div>

      <div id="entries-section" style="display:none">
        <div class="sec-title" style="margin-top:1rem">💸 輸贏金額</div>
        <div class="hint" style="margin-bottom:10px;margin-top:-4px">⚠️ 此欄只填打牌的輸贏，莊錢由系統自動處理</div>
        <div id="player-entries"></div>
        <div id="sum-status"></div>
      </div>

      <div style="height: 80px"></div>
      <div class="action-bar">
        <button
          class="btn btn-green btn-full"
          onclick="saveRecord()"
          style="font-size: 16px"
        >
          💾 儲存此局
        </button>
      </div>
    </div>

    <!-- ═══ 歷史紀錄 ═══ -->
    <div class="page" id="page-history">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 12px;
        "
      >
        <div class="sec-title" style="margin: 0">📚 所有牌局</div>
        <button class="btn btn-gray btn-sm" onclick="downloadBackup()">
          ⬇️ 備份
        </button>
      </div>
      <div id="history-list">
        <div class="loading">
          <div class="spinner"></div>
          載入中…
        </div>
      </div>
    </div>

    <!-- ═══ 月結算 ═══ -->
    <div class="page" id="page-settle">
      <div class="sec-title">🗓️ 選擇月份</div>
      <div class="card">
        <div class="form-row" style="align-items: flex-end">
          <div class="form-group">
            <label>月份</label>
            <input type="month" id="settle-month" />
          </div>
          <button class="btn btn-blue" onclick="calcSettle()">🔄 計算</button>
        </div>
      </div>
      <div id="settle-result"></div>
    </div>

    <!-- ═══ 成員 ═══ -->
    <div class="page" id="page-players">
      <div class="sec-title">➕ 新增成員</div>
      <div class="card">
        <div class="form-row" style="align-items: flex-end">
          <div class="form-group">
            <label>姓名</label>
            <input
              type="text"
              id="new-player-name"
              placeholder="輸入名字"
              onkeydown="if (event.key === 'Enter') addPlayer();"
            />
          </div>
          <button class="btn btn-blue" onclick="addPlayer()">＋ 新增</button>
        </div>
      </div>

      <div class="sec-title">👥 目前成員</div>
      <div class="card">
        <div id="player-list" class="member-list">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </div>

      <div class="sec-title">🔧 資料管理</div>
      <div class="card">
        <p
          style="
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 12px;
            line-height: 1.6;
          "
        >
          備份可匯出所有記錄為 JSON 檔案，建議每月結算後下載一份保存。
        </p>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <button class="btn btn-gray" onclick="downloadBackup()">
            ⬇️ 下載備份
          </button>
          <button
            class="btn btn-gray"
            onclick="document.getElementById('import-file').click()"
          >
            ⬆️ 匯入備份
          </button>
        </div>
        <input
          type="file"
          id="import-file"
          accept=".json"
          style="display: none"
          onchange="importBackup(this)"
        />
      </div>
    </div>

    <div id="toast"></div>

    <script>
    // ── Firebase REST API（無需任何 SDK，純 fetch）────────────────
    const DB = 'https://mahjong-tracker-43c84-default-rtdb.asia-southeast1.firebasedatabase.app';
    const KEY = 'AIzaSyAMGKb9hg_Mv7hB3pLxVCtSCjP41Y8hN-8';

    async function dbGet(path) {
      const r = await fetch(`${DB}/${path}.json?auth=${KEY}`);
      return r.json();
    }
    async function dbPush(path, data) {
      const r = await fetch(`${DB}/${path}.json?auth=${KEY}`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify(data)
      });
      return r.json();
    }
    async function dbRemove(path) {
      await fetch(`${DB}/${path}.json?auth=${KEY}`, {method:'DELETE'});
    }
    async function dbSet(path, data) {
      await fetch(`${DB}/${path}.json?auth=${KEY}`, {
        method: 'PUT', headers: {'Content-Type':'application/json'},
        body: JSON.stringify(data)
      });
    }

    // 即時監聽（每 30 秒輪詢，輸入中不打斷）
    const listeners = {};
    let userTyping = false;
    let typingTimer = null;

    document.addEventListener('focusin', e => {
      if(e.target.matches('input, select, textarea')) {
        userTyping = true;
        clearTimeout(typingTimer);
      }
    });
    document.addEventListener('focusout', e => {
      if(e.target.matches('input, select, textarea')) {
        // 離開欄位後 1 秒才解除保護，避免在欄位間切換時被打斷
        typingTimer = setTimeout(() => { userTyping = false; }, 1000);
      }
    });

    function dbListen(path, cb) {
      async function poll() {
        try {
          const data = await dbGet(path);
          // 使用者正在輸入時，只更新 state 資料，不重新 render 頁面
          if(userTyping) {
            if(path === 'players') {
              state.players = data ? Object.entries(data).map(([id,v])=>({id,...v})) : [];
            } else if(path === 'records') {
              state.records = data
                ? Object.entries(data).map(([id,v])=>({id,...v})).sort((a,b)=>b.date.localeCompare(a.date))
                : [];
            }
            return;
          }
          cb(data);
        } catch(e) { console.warn('poll error', e); }
      }
      poll();
      listeners[path] = setInterval(poll, 30000);
    }

    // ── State ─────────────────────────────────────────────────────
    let state = { players: [], records: [] };
    let selectedPlayers = []; // 本局選中的參與者

    function initDB() {
      document.getElementById('sync-indicator').style.opacity = '1';
      dbListen('players', data => {
        state.players = data ? Object.entries(data).map(([id,v])=>( {id,...v})) : [];
        renderPlayers(); renderPicker(); refreshSelects();
      });
      dbListen('records', data => {
        state.records = data
          ? Object.entries(data).map(([id,v])=>( {id,...v})).sort((a,b)=>b.date.localeCompare(a.date))
          : [];
        renderHistory();
        document.getElementById('sync-status').textContent = `同步完成 · ${state.records.length} 筆記錄`;
      });
    }

    function renderAll(){ renderPlayers(); renderPicker(); renderHistory(); refreshSelects(); }

    // ── Navigation ───────────────────────────────────────────────
    window.switchPage = function(p) {
      document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el=>el.classList.remove('active'));
      document.getElementById('page-'+p).classList.add('active');
      document.getElementById('nav-'+p).classList.add('active');
      if(p==='settle') document.getElementById('settle-month').value=new Date().toISOString().slice(0,7);
    };

    function toast(msg) {
      const el=document.getElementById('toast');
      el.textContent=msg; el.classList.add('show');
      setTimeout(()=>el.classList.remove('show'),2500);
    }

    const AV=['av0','av1','av2','av3','av4','av5','av6','av7'];
    function av(i){ return AV[i%AV.length]; }

    // ── Selects ──────────────────────────────────────────────────
    function refreshSelects(){
      const list=selectedPlayers.length>0?selectedPlayers:state.players.map(p=>p.name);
      document.getElementById('r-dealer-payer').innerHTML =
        `<option value="">— 無 / 之後補 —</option>` +
        list.map(name=>`<option value="${name}">${name}</option>`).join('');
    }

    // ── Players ──────────────────────────────────────────────────
    function renderPlayers(){
      const el=document.getElementById('player-list');
      if(!state.players.length){ el.innerHTML='<span style="color:var(--text-muted);font-size:14px">尚無成員</span>'; return; }
      el.innerHTML=state.players.map((p,i)=>`
        <span class="member-chip">
          <span class="${av(i)}" style="width:26px;height:26px;font-size:12px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800">${p.name.charAt(0)}</span>
          ${p.name}
          <button class="remove-btn" onclick="removePlayer('${p.id}','${p.name}')">×</button>
        </span>`).join('');
    }

    function renderPicker(){
      const el=document.getElementById('player-picker');
      if(!state.players.length){
        el.innerHTML='<div class="empty"><span class="empty-icon">👥</span><p>請先在「成員」頁面新增玩家</p></div>';
        document.getElementById('entries-section').style.display='none';
        return;
      }
      el.innerHTML=`<div style="display:flex;flex-wrap:wrap;gap:8px;padding:4px 0">`+
        state.players.map((p,i)=>{
          const sel=selectedPlayers.includes(p.name);
          return `<button onclick="togglePlayer('${p.name}')" style="display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:20px;border:2px solid ${sel?'var(--green)':'var(--border)'};background:${sel?'#eafaf1':'#fff'};cursor:pointer;font-size:14px;font-weight:700;font-family:inherit;transition:all .15s">
            <span class="${av(i)}" style="width:24px;height:24px;font-size:11px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800">${p.name.charAt(0)}</span>
            ${p.name}
            ${sel?'<span style="color:var(--green);font-size:16px">✓</span>':''}
          </button>`;
        }).join('')+`</div>`;
      if(selectedPlayers.length>0){
        el.innerHTML+=`<div style="margin-top:8px;font-size:12px;color:var(--text-muted)">已選 ${selectedPlayers.length} 人：${selectedPlayers.join('、')}</div>`;
      }
      renderEntries();
    }

    window.togglePlayer = function(name){
      const idx=selectedPlayers.indexOf(name);
      if(idx>=0) selectedPlayers.splice(idx,1);
      else selectedPlayers.push(name);
      renderPicker();
      // 同步更新莊錢付款人下拉
      refreshSelects();
    };

    function renderEntries(){
      const sec=document.getElementById('entries-section');
      const el=document.getElementById('player-entries');
      if(!selectedPlayers.length){
        sec.style.display='none';
        return;
      }
      sec.style.display='block';
      el.innerHTML=selectedPlayers.map((name,i)=>{
        const pi=state.players.findIndex(p=>p.name===name);
        const colorIdx=pi>=0?pi:i;
        return `<div class="player-card">
          <div class="player-avatar ${av(colorIdx)}">${name.charAt(0)}</div>
          <span class="player-name-label">${name}</span>
          <input type="number" id="amt-${i}" placeholder="± 金額" step="50" oninput="checkSum()" inputmode="numeric">
        </div>`;
      }).join('');
      checkSum();
    }

    window.addPlayer = async function(){
      const inp=document.getElementById('new-player-name');
      const name=inp.value.trim();
      if(!name){ toast('請輸入名字'); return; }
      if(state.players.find(p=>p.name===name)){ toast('成員已存在'); return; }
      await dbPush('players', {name});
      inp.value=''; toast(`✅ 已新增 ${name}`);
    };

    window.removePlayer = async function(id, name){
      if(!confirm(`確定移除「${name}」嗎？`)) return;
      await dbRemove(`players/${id}`);
      toast(`移除 ${name}`);
    };

    // ── Sum Check ────────────────────────────────────────────────
    window.checkSum = function(){
      if(!selectedPlayers.length) return;
      let win=0, lose=0, allFilled=true;
      selectedPlayers.forEach((_,i)=>{
        const v=parseFloat(document.getElementById('amt-'+i)?.value||'');
        if(isNaN(v)) allFilled=false;
        else if(v>0) win+=v;
        else lose+=Math.abs(v);
      });
      const dealerAmt=parseFloat(document.getElementById('r-dealer-amt')?.value||'0')||0;
      const payer=document.getElementById('r-dealer-payer')?.value||'';
      const el=document.getElementById('sum-status');
      if(!allFilled){ el.innerHTML=''; return; }
      // 正確邏輯：輸方合計 = 贏方合計 + 莊錢
      const diff=Math.round((lose - win - dealerAmt)*100)/100;
      let html='';
      if(Math.abs(diff)<0.01){
        html=`<div class="status status-ok">✅ 金額正確（輸 $${lose} = 贏 $${win} + 莊錢 $${dealerAmt}）</div>`;
      } else {
        html=`<div class="status status-err">⚠️ 金額不平衡，差額 $${Math.abs(diff)}（輸方應等於贏方 + 莊錢）</div>`;
      }
      if(payer && dealerAmt>0){
        html+=`<div class="status status-info">💰 ${payer} 當天現金付了莊錢 $${dealerAmt}，月結時將自動退回</div>`;
      }
      el.innerHTML=html;
    };

    // ── Save Record ──────────────────────────────────────────────
    window.saveRecord = async function(){
      const date=document.getElementById('r-date').value;
      const place=document.getElementById('r-place').value.trim();
      const rounds=parseInt(document.getElementById('r-rounds').value)||0;
      const dealerAmt=parseFloat(document.getElementById('r-dealer-amt').value||'0')||0;
      const dealerPayer=document.getElementById('r-dealer-payer').value;
      if(!date){ toast('請填寫日期'); return; }
      if(!place){ toast('請填寫地點'); return; }
      if(!selectedPlayers.length){ toast('請先選擇本局參與成員'); return; }
      let entries={}, sum=0, ok=true;
      selectedPlayers.forEach((name,i)=>{
        const v=parseFloat(document.getElementById('amt-'+i)?.value||'');
        if(isNaN(v)){ ok=false; return; }
        entries[name]=v; sum+=v;
      });
      if(!ok){ toast('請填寫所有玩家的輸贏金額'); return; }
      // 正確邏輯：輸方合計 = 贏方合計 + 莊錢
      let win=0, lose=0;
      Object.values(entries).forEach(v=>{ if(v>0) win+=v; else lose+=Math.abs(v); });
      const diff=Math.round((lose - win - dealerAmt)*100)/100;
      if(Math.abs(diff)>0.01){
        if(!confirm(`金額不平衡（差額 $${Math.abs(diff)}），確定要儲存嗎？`)) return;
      }
      await dbPush('records', {date,place,rounds,entries,dealer:{amount:dealerAmt,payer:dealerPayer},createdAt:Date.now()});
      toast('🎉 已儲存！');
      document.getElementById('r-place').value='';
      document.getElementById('r-rounds').value='';
      document.getElementById('r-dealer-amt').value='';
      document.getElementById('r-dealer-payer').value='';
      selectedPlayers=[];
      renderPicker();
    };

    // ── History ──────────────────────────────────────────────────
    function renderHistory(){
      const el=document.getElementById('history-list');
      if(!state.records.length){
        el.innerHTML=`<div class="empty"><span class="empty-icon">🀄</span><p>還沒有牌局記錄<br>快去記第一局吧！</p></div>`;
        return;
      }
      el.innerHTML=state.records.map(r=>{
        const d=r.dealer||{};
        const pills=Object.entries(r.entries||{}).map(([name,amt])=>{
          const cls=amt>0?'chip-green':amt<0?'chip-red':'chip-gray';
          const sign=amt>0?'＋':'';
          return `<span class="chip ${cls}">${name} ${sign}$${Math.round(amt)}</span>`;
        }).join('');
        const dealerNote=d.amount>0
          ? `💵 莊錢 $${d.amount}　${d.payer?`${d.payer} 當天付清`:'⏳ 待確認付款人'}`:'';
        return `
        <div class="history-item">
          <div class="history-head">
            <div>
              <div class="history-date">📅 ${r.date}</div>
              <div style="color:rgba(255,255,255,.65);font-size:12px;margin-top:2px">📍 ${r.place}</div>
            </div>
            <div style="display:flex;gap:6px;align-items:center">
              ${r.rounds?`<span class="chip chip-yellow">🀄${r.rounds}將</span>`:''}
              <button class="btn btn-sm btn-red" onclick="deleteRecord('${r.id}')" style="background:rgba(231,76,60,.2);border-color:rgba(231,76,60,.4);color:#fff;padding:5px 9px">🗑</button>
            </div>
          </div>
          <div class="history-body">
            <div style="display:flex;flex-wrap:wrap;gap:6px">${pills}</div>
            ${dealerNote?`<div class="history-dealer-note">${dealerNote}</div>`:''}
          </div>
        </div>`;
      }).join('');
    }

    window.deleteRecord = async function(id){
      if(!confirm('確定要刪除這筆記錄嗎？此操作無法復原。')) return;
      await dbRemove(`records/${id}`);
      toast('🗑 已刪除');
    };

    // ── Settle ───────────────────────────────────────────────────
    window.calcSettle = function(){
      const month=document.getElementById('settle-month').value;
      if(!month){ toast('請選擇月份'); return; }
      const recs=state.records.filter(r=>r.date.startsWith(month));
      const el=document.getElementById('settle-result');
      if(!recs.length){ el.innerHTML=`<div class="empty"><span class="empty-icon">🔍</span><p>此月份沒有任何記錄</p></div>`; return; }
      const skillTotals={}, dealerPaid={}, venueStats={};
      recs.forEach(r=>{
        const d=r.dealer||{};
        Object.entries(r.entries||{}).forEach(([p,v])=>{ skillTotals[p]=(skillTotals[p]||0)+v; });
        if(d.payer&&d.amount>0) dealerPaid[d.payer]=(dealerPaid[d.payer]||0)+d.amount;
        const vk=r.place||'未知';
        if(!venueStats[vk]) venueStats[vk]={sessions:0,rounds:0,totalDealer:0};
        venueStats[vk].sessions++; venueStats[vk].rounds+=(r.rounds||0); venueStats[vk].totalDealer+=(d.amount||0);
      });
      const actualTotals={};
      const allPlayers=new Set([...Object.keys(skillTotals),...Object.keys(dealerPaid)]);
      allPlayers.forEach(p=>{ actualTotals[p]=(skillTotals[p]||0)+(dealerPaid[p]||0); });
      const sessions=recs.length;
      const totalRounds=recs.reduce((s,r)=>s+(r.rounds||0),0);
      const totalDealer=recs.reduce((s,r)=>s+((r.dealer||{}).amount||0),0);
      const sign=v=>v>0?'＋':v===0?'':'';
      let html=`
        <div class="sec-title">📊 ${month} 整體統計</div>
        <div class="metric-grid">
          <div class="metric"><div class="metric-label">場次</div><div class="metric-val">${sessions}</div></div>
          <div class="metric"><div class="metric-label">總將數</div><div class="metric-val">${totalRounds}</div></div>
          <div class="metric"><div class="metric-label">總莊錢</div><div class="metric-val">$${Math.round(totalDealer)}</div></div>
        </div>
        <div class="legend">
          <div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div>輸贏（不含莊錢）</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--teal)"></div>實際應付（扣莊錢後）</div>
        </div>
        <div class="sec-title">💰 各人結算明細</div>`;
      [...allPlayers].forEach(p=>{
        const skill=Math.round(skillTotals[p]||0);
        const paid=Math.round(dealerPaid[p]||0);
        const actual=Math.round(actualTotals[p]||0);
        const skillCls=skill>0?'pos':skill<0?'neg':'';
        const actualCls=actual>0?'pos':actual<0?'neg':'';
        html+=`
        <div class="two-layer">
          <div class="two-layer-top">
            <div class="two-layer-label">🎯 輸贏（不含莊錢）</div>
            <div style="display:flex;justify-content:space-between;align-items:center">
              <span style="font-weight:700;font-size:15px">${p}</span>
              <span class="num ${skillCls}" style="font-size:20px;font-weight:900">${skill<0?'-':'+'}$${Math.abs(skill)}</span>
            </div>
            ${paid>0?`<div style="font-size:12px;color:var(--text-muted);margin-top:4px">已當天現金付莊錢 $${paid}（本月累計）</div>`:''}
          </div>
          <div class="two-layer-bottom">
            <div class="two-layer-label">💳 月結實際應付金額</div>
            <div style="display:flex;justify-content:space-between;align-items:center">
              <span style="font-size:13px;color:var(--text-muted)">${paid>0?`輸贏 ${skill<0?'-':'+'}$${Math.abs(skill)}，退回莊錢 +$${paid}`:'與輸贏金額相同'}</span>
              <span class="num ${actualCls}" style="font-size:20px;font-weight:900;color:${actual>0?'var(--green-dark)':actual<0?'var(--red-dark)':'var(--text-muted)'}">${sign(actual)}$${Math.abs(actual)}</span>
            </div>
          </div>
        </div>`;
      });
      const plan=calcPlan(actualTotals);
      html+=`<div class="sec-title" style="margin-top:1rem">💸 月結轉帳計畫</div>`;
      if(!plan.length){
        html+=`<div class="status status-ok">🎉 大家實際都平手，無需轉帳！</div>`;
      } else {
        html+=`<div class="card">`;
        plan.forEach(({from,to,amount})=>{
          html+=`<div class="settle-row"><span class="settle-from">${from}</span><span class="settle-arrow">➜</span><span class="settle-to">${to}</span><span class="settle-amount settle-amount-neutral">$${Math.round(amount)}</span></div>`;
        });
        html+=`</div>`;
      }
      html+=`<div class="sec-title" style="margin-top:1rem">🏠 各場地莊錢統計</div>`;
      Object.entries(venueStats).forEach(([venue,vs])=>{
        const bg=vs.totalDealer>0?'#eafaf1':'#f5f5f3';
        const bc=vs.totalDealer>0?'#a9dfbf':'var(--border)';
        html+=`
        <div class="venue-card">
          <div class="venue-head" style="background:${bg};border-color:${bc}">
            <div class="venue-head-name">📍 ${venue}</div>
            <span class="chip chip-teal">莊錢共 $${Math.round(vs.totalDealer)}</span>
          </div>
          <div class="venue-body">
            <div class="venue-stat-row"><span class="venue-stat-label">本月場次</span><span class="venue-stat-val">${vs.sessions} 場</span></div>
            <div class="venue-stat-row"><span class="venue-stat-label">總將數</span><span class="venue-stat-val">${vs.rounds} 將</span></div>
            <div class="venue-stat-row" style="border-bottom:none;font-weight:700"><span class="venue-stat-label">本月莊錢合計</span><span class="venue-stat-val" style="color:var(--teal-dark)">$${Math.round(vs.totalDealer)}</span></div>
          </div>
        </div>`;
      });
      el.innerHTML=html;
    };

    function calcPlan(totals){
      const c=Object.entries(totals).filter(([,v])=>v>0).map(([name,amt])=>( {name,amt:Math.round(amt)})).sort((a,b)=>b.amt-a.amt);
      const d=Object.entries(totals).filter(([,v])=>v<0).map(([name,amt])=>( {name,amt:Math.round(amt)})).sort((a,b)=>a.amt-b.amt);
      const plan=[]; let ci=0,di=0;
      while(ci<c.length&&di<d.length){
        const amt=Math.min(c[ci].amt,-d[di].amt);
        if(amt>0) plan.push({from:d[di].name,to:c[ci].name,amount:amt});
        c[ci].amt-=amt; d[di].amt+=amt;
        if(c[ci].amt===0) ci++; if(d[di].amt===0) di++;
      }
      return plan;
    }

    // ── Backup ───────────────────────────────────────────────────
    window.downloadBackup = function(){
      const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),players:state.players,records:state.records},null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download=`麻將帳本備份_${new Date().toISOString().slice(0,10)}.json`; a.click();
      URL.revokeObjectURL(url);
      toast('⬇️ 備份下載中');
    };

    window.importBackup = async function(input){
      const file=input.files[0]; if(!file) return;
      try {
        const data=JSON.parse(await file.text());
        if(!data.records||!data.players){ toast('❌ 檔案格式不正確'); return; }
        if(!confirm(`確定匯入備份？將覆蓋現有 ${state.records.length} 筆記錄。`)) return;
        await dbSet('records', Object.fromEntries(data.records.map(r=>[r.id||('r'+Date.now()),r])));
        await dbSet('players', Object.fromEntries(data.players.map(p=>[p.id||('p'+Date.now()),{name:p.name||p}])));
        toast('✅ 匯入成功！');
      } catch(e){ toast('❌ 匯入失敗，請確認檔案格式'); }
      input.value='';
    };

    // ── Init ─────────────────────────────────────────────────────
    document.getElementById('r-date').value = new Date().toISOString().slice(0,10);
    initDB();
    </script>
  </body>
</html>
